[project]
name = "safepayai"
version = "0.1.0"
requires-python = ">=3.12"
description = "SafePayAI monorepo workspace root (PayPal AI Hackathon 2026)."

[tool.uv.workspace]
members = [
  "services/api-gateway",
  "services/mandate",
  "services/catalog",
  "services/shopping-agent",
  "services/checkout",
  "services/paypal-adapter",
  "services/tracking",
  "services/resolution",
  "services/triage-ai",
  "services/audit",
  "libs/common",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
# Every service idiomatically uses bare `dict`/`list` for loosely-typed JSON payloads
# (request/response bodies, event envelopes) rather than spelling out `dict[str, Any]`
# everywhere; disallow_any_generics (part of strict) was flagging ~95 of these across the
# first 4 services with no real type-safety benefit. Keep the rest of strict (no-untyped-def,
# no-any-return, etc. all still apply and have already caught real bugs).
disallow_any_generics = false
