[project]
name = "ps-triage-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.143.0",
  "uvicorn[standard]>=0.54.0",
  "pydantic-settings>=2.15.0",
  "sqlalchemy[asyncio]>=2.1.4",
  "asyncpg>=0.32.0",
  "alembic>=1.20.0",
  "httpx>=0.28.1",
  "pyjwt>=2.15.1",
  "safepayai-common",
]
# Service-specific deps per conventions doc section 7 (ADR-010: LLM services add the
# provider SDKs) — added now so Wave 5 can wire them without a pyproject change, but no
# provider SDK calls exist yet in app/llm_provider.py (NotImplementedError stubs only).

[tool.uv]
dev-dependencies = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]

[tool.uv.sources]
safepayai-common = { workspace = true }

[project.optional-dependencies]
dev = []
