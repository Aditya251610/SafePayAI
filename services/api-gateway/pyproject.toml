[project]
name = "ps-api-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.143.0",
  "uvicorn[standard]>=0.54.0",
  "pydantic-settings>=2.15.0",
  "sqlalchemy[asyncio]>=2.1.4",
  "asyncpg>=0.32.0",
  "alembic>=1.20.0",
  "httpx>=0.28.1",
  "pyjwt[crypto]>=2.15.1",
  "argon2-cffi>=25.1.0",
  "safepayai-common",
]

[tool.uv]
dev-dependencies = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]

[tool.ruff.lint]
# B008 (no function calls in argument defaults) fires on every `Depends(...)` default, the
# standard FastAPI dependency-injection idiom used throughout this service - ignored here
# rather than rewritten into a module-level-singleton workaround, matching catalog's same
# documented choice.
extend-ignore = ["B008"]

[tool.uv.sources]
safepayai-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
