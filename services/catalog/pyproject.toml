[project]
name = "ps-catalog"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162.0",
  "uvicorn[standard]>=0.54.0",
  "pydantic-settings>=2.16.2",
  "sqlalchemy[asyncio]>=2.1.8",
  "asyncpg>=0.32.0",
  "alembic>=1.20.1",
  "httpx>=0.28.1",
  "pyjwt>=2.15.1",
  "safepayai-common",
]

[tool.uv]
dev-dependencies = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["unit: no DB, no network", "integration: real Postgres via alembic upgrade head"]

[tool.ruff.lint]
# B008 (no function calls in argument defaults) fires on every `Depends(...)` default,
# which is the standard FastAPI dependency-injection idiom used throughout this
# service (and already present in Wave 4's deps.py/admin.py before this change) -
# ignored here rather than rewritten into a module-level-singleton workaround that
# would make the routers harder to read for no safety benefit.
extend-ignore = ["B008"]

[tool.uv.sources]
safepayai-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app_catalog"]
