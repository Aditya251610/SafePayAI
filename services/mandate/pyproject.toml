[project]
name = "ps-mandate"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "httpx>=0.27",
  "pyjwt>=2.9",
  "safepayai-common",
]

[tool.uv]
dev-dependencies = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff.lint]
# B008 (no function calls in argument defaults) fires on every `Depends(...)` default,
# the standard FastAPI dependency-injection idiom used throughout this service - ignored
# here per the same documented exception as services/catalog/pyproject.toml.
extend-ignore = ["B008"]

[tool.uv.sources]
safepayai-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
