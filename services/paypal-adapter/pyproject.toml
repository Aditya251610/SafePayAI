[project]
name = "ps-paypal-adapter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162.0",
  "uvicorn[standard]>=0.54.0",
  "pydantic-settings>=2.16.2",
  "sqlalchemy[asyncio]>=2.1.8",
  "asyncpg>=0.32.0",
  "alembic>=1.20.1",
  "httpx>=0.28.1",
  "pyjwt>=2.15.1",
  "safepayai-common",
]

[tool.uv]
dev-dependencies = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13", "respx>=0.21", "asyncpg>=0.32.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.uv.sources]
safepayai-common = { workspace = true }

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
