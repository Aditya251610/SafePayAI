[project]
name = "ps-audit"
version = "0.1.0"
requires-python = ">=3.12"
description = "SafePayAI audit service: append-only, hash-chained event log (tamper-evident, not on the money path)."
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "httpx>=0.27",
  "pyjwt>=2.9",
  "pynacl>=1.5",
  "safepayai-common",
]

[tool.uv]
dev-dependencies = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
# Session-scoped event loop: integration tests share one asyncpg/SQLAlchemy engine
# (app.db's module-global singleton) across every test in the file, so every async
# test/fixture must run on the SAME event loop -- function-scoped loops (the default)
# cause "Future attached to a different loop" errors on the second test in a file.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.uv.sources]
safepayai-common = { workspace = true }

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint]
# Root config (../../pyproject.toml, not touched -- out of this wave's scope) selects
# flake8-bugbear ("B") without an immutable-calls allowlist, so every FastAPI
# `Depends(...)`/`Query(...)` default (the standard, required FastAPI pattern used
# throughout this service and already present in Wave 4's routers) trips B008. Scoped
# here, not at the root, since this is audit-specific noise suppression, not a
# project-wide policy change.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app_audit"]
