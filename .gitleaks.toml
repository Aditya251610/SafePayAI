title = "safepayai gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "paypal-client-secret-like"
description = "String shaped like a PayPal sandbox client secret"
regex = '''E[A-Za-z0-9_-]{60,80}'''
tags = ["paypal", "secret"]

[allowlist]
description = "placeholders and test fixtures only"
paths = [
  '''\.env\.example$''',
  # Dev-only outbox-relay JWT signing key (not a secret): deliberately committed so
  # docker-compose/CI work out of the box, mirrors the existing
  # services/audit/app_audit/auth_fixtures/local_jwks.json fixture pattern. Every producer
  # service's PS_<SLUG>_OUTBOX_RELAY_JWT_PRIVATE_KEY defaults to this value; a real
  # deployment overrides it with its own key. See the constant's own docstring in
  # libs/common/safepayai_common/outbox/relay.py for the full rationale. Path-based
  # (not fingerprint-based) so this survives a squash-merge's new commit SHA.
  '''libs/common/safepayai_common/outbox/relay\.py$''',
  '''libs/common/tests/unit/test_relay\.py$''',
]
regexes = [
  '''changeme''',
  '''FAKE_[A-Z0-9_]+''',
]
