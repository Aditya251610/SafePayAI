openapi: 3.1.0
info:
  title: resolution
  version: "0.1.0"
  description: >
    12-state case machine + REFUNDS_FROZEN kill switch. Derived from
    .claude/prd/services/resolution/api.md. All routes below are real (buyer-report -> decide
    -> offer -> accept -> refund path, the reviewer/merchant/approval-link/appeal path, the
    REFUNDS_FROZEN kill switch backed by the real DB-row control_flags, and the internal
    events/outbox/tick endpoints).
servers:
  - url: /
paths:
  /health:
    get:
      operationId: health
      responses:
        "200": { description: liveness, content: { application/json: { schema: { $ref: "#/components/schemas/HealthResponse" } } } }
  /healthz:
    get:
      operationId: healthz
      responses:
        "200": { description: liveness (alias), content: { application/json: { schema: { $ref: "#/components/schemas/HealthResponse" } } } }
  /readyz:
    get:
      operationId: readyz
      responses:
        "200": { description: ready, content: { application/json: { schema: { $ref: "#/components/schemas/ReadyResponse" } } } }
        "503": { description: not ready, content: { application/json: { schema: { $ref: "#/components/schemas/ReadyResponse" } } } }
  /health/deep:
    get:
      operationId: healthDeep
      responses:
        "200": { description: keep-warm deep check, content: { application/json: { schema: { $ref: "#/components/schemas/ReadyResponse" } } } }
  /cases/report:
    post:
      operationId: reportCase
      security: [{ internalJwt: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportCaseRequest" }
      responses:
        "201": { description: "case created (always 201 -- the real handler has no idempotent-replay/200 path today, only the fixed @router.post status_code)", content: { application/json: { schema: { $ref: "#/components/schemas/ReportCaseResponse" } } } }
        "400": { description: IDEMPOTENCY_KEY_REQUIRED (missing Idempotency-Key header) }
        "401": { description: missing/invalid bearer token }
        "422": { description: "request validation error (e.g. text over 4000 chars, unknown field -- extra=forbid)" }
  /cases/{case_id}:
    get:
      operationId: getCase
      security: [{ internalJwt: [] }]
      parameters:
        - { name: case_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: case detail, content: { application/json: { schema: { $ref: "#/components/schemas/CaseDetailResponse" } } } }
        "401": { description: missing/invalid bearer token }
        "404": { description: CASE_NOT_FOUND }
  /cases:
    get:
      operationId: listCases
      security: [{ internalJwt: [] }]
      description: >
        A buyer caller (claims.act.role == "buyer") is always scoped to their own
        buyer_id regardless of query params; any other role sees all cases matching the
        filters.
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: order_id, in: query, schema: { type: string } }
      responses:
        "200": { description: list, content: { application/json: { schema: { $ref: "#/components/schemas/ListCasesResponse" } } } }
        "401": { description: missing/invalid bearer token }
  /review/queue:
    get:
      operationId: reviewQueue
      security: [{ internalJwt: [] }]
      responses:
        "200": { description: HUMAN_REVIEW queue, content: { application/json: { schema: { $ref: "#/components/schemas/ReviewQueueResponse" } } } }
        "401": { description: missing/invalid bearer token }
  /cases/{case_id}/review-decision:
    post:
      operationId: reviewDecision
      security: [{ internalJwt: [] }]
      parameters:
        - { name: case_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewDecisionRequest" }
      responses:
        "200": { description: decision applied, content: { application/json: { schema: { $ref: "#/components/schemas/ReviewDecisionResponse" } } } }
        "403": { description: "ROLE_NOT_ALLOWED (caller's claims.act.role must be reviewer)" }
        "404": { description: CASE_NOT_FOUND }
        "409": { description: "ILLEGAL_TRANSITION (case not in HUMAN_REVIEW) / CONCURRENT_MODIFICATION" }
        "422": { description: "REASON_REQUIRED (decision DECLINE/CLOSE with no non-empty reason) / request validation error" }
  /offers/{offer_id}/accept:
    post:
      operationId: acceptOffer
      security: [{ internalJwt: [] }]
      parameters:
        - { name: offer_id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferAcceptRequest" }
      responses:
        "200": { description: accepted, content: { application/json: { schema: { $ref: "#/components/schemas/OfferAcceptResponse" } } } }
        "404": { description: "OFFER_NOT_FOUND (also returned for the wrong buyer -- no enumeration)" }
        "409": { description: OFFER_NOT_ACTIVE / PROPOSAL_HASH_MISMATCH }
  /offers/{offer_id}/decline:
    post:
      operationId: declineOffer
      security: [{ internalJwt: [] }]
      parameters:
        - { name: offer_id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferDeclineRequest" }
      responses:
        "200": { description: declined, content: { application/json: { schema: { $ref: "#/components/schemas/OfferDeclineResponse" } } } }
        "404": { description: "OFFER_NOT_FOUND (also returned for the wrong buyer -- no enumeration)" }
        "409": { description: OFFER_NOT_ACTIVE }
  /approvals/{token}:
    get:
      operationId: previewApproval
      security: [{ internalJwt: [] }]
      description: >
        Pure read, no state change. Any invalid/expired/revoked/consumed token returns 404
        (no enumeration of which, except the distinct detail codes below).
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: preview, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalPreviewResponse" } } } }
        "404": { description: APPROVAL_NOT_FOUND / APPROVAL_REPLAY (consumed) / APPROVAL_REVOKED / APPROVAL_EXPIRED }
  /approvals/{token}/consent:
    post:
      operationId: consentApproval
      security: [{ internalJwt: [] }]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalConsentRequest" }
      responses:
        "200": { description: consented, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalConsentResponse" } } } }
        "404": { description: APPROVAL_NOT_FOUND / APPROVAL_REVOKED / APPROVAL_EXPIRED }
        "409": { description: "APPROVAL_REPLAY (consumed, or lost a race against another consent) / PROPOSAL_HASH_MISMATCH / OFFER_NOT_ACTIVE / ILLEGAL_TRANSITION" }
  /cases/{case_id}/merchant-action:
    post:
      operationId: merchantAction
      security: [{ internalJwt: [] }]
      description: >
        No amount is accepted from the client -- the offer amount is always server-computed.
        OVERRIDE_OFFER is legal from DECLINED (T25) or OFFERED (T26, supersedes the active
        offer); CONFIRM_RESHIP is legal only from OFFERED with an ACTIVE/ACCEPTED RESHIP offer
        (T10).
      parameters:
        - { name: case_id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MerchantActionRequest" }
      responses:
        "200": { description: action applied, content: { application/json: { schema: { $ref: "#/components/schemas/MerchantActionResponse" } } } }
        "403": { description: "ROLE_NOT_ALLOWED (caller's claims.act.role must be merchant)" }
        "404": { description: CASE_NOT_FOUND }
        "409": { description: ILLEGAL_TRANSITION }
  /cases/{case_id}/appeal:
    post:
      operationId: appealCase
      security: [{ internalJwt: [] }]
      parameters:
        - { name: case_id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppealRequest" }
      responses:
        "200": { description: appealed, content: { application/json: { schema: { $ref: "#/components/schemas/AppealResponse" } } } }
        "404": { description: "CASE_NOT_FOUND (also returned for the wrong buyer -- no enumeration)" }
        "409": { description: ILLEGAL_TRANSITION }
  /refunds/reconcile:
    post:
      operationId: reconcileRefunds
      security: [{ internalJwt: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReconcileRequest" }
      responses:
        "200": { description: reconciled, content: { application/json: { schema: { $ref: "#/components/schemas/ReconcileResponse" } } } }
  /controls/refunds-frozen:
    get:
      operationId: getRefundsFrozen
      security: [{ internalJwt: [] }]
      description: >
        Reads resolution.control_flags. Absent/unreadable is fail-closed (readable=false,
        refunds_frozen=true), never an error response.
      responses:
        "200": { description: current state, content: { application/json: { schema: { $ref: "#/components/schemas/RefundsFrozenState" } } } }
    put:
      operationId: putRefundsFrozen
      security: [{ internalJwt: [] }]
      description: >
        Operator-only toggle. Writes the real control_flags row and a refund.freeze_changed
        outbox event. The paypal-adapter mirror push (PUT /v1/controls/refunds-frozen there)
        is NOT performed by this endpoint -- adapter_mirror is always reported PENDING;
        paypal-adapter's own kill switch must be toggled there separately for now.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundsFrozenPutRequest" }
      responses:
        "200": { description: toggled, content: { application/json: { schema: { $ref: "#/components/schemas/RefundsFrozenState" } } } }
        "403": { description: "ROLE_NOT_ALLOWED (caller's claims.act.role must be operator)" }
        "422": { description: "request validation error (reason must be non-empty)" }
  /notifications:
    get:
      operationId: listNotifications
      security: [{ internalJwt: [] }]
      description: >
        A buyer caller sees only their own notifications (scoped by claims.buyer_id); any
        other role (e.g. merchant) sees all notifications unscoped.
      responses:
        "200": { description: notifications, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationsResponse" } } } }
  /internal/events:
    post:
      operationId: internalEventsReceive
      security: [{ internalJwt: [] }]
      description: >
        Inbox for shipment.late_detected/shipment.lost_detected: opens a DETECTOR-origin case
        (idempotent on (order_id, kind)) and runs the same decide -> offer-creation path as a
        buyer report, skipping triage-ai entirely. Unknown event types are accepted and
        ignored (at-least-once delivery, forward-compatible) -- `handled: false`.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InternalEventEnvelope" }
      responses:
        "200": { description: accepted (handled or ignored), content: { application/json: { schema: { $ref: "#/components/schemas/InternalEventsReceiveResponse" } } } }
        "401": { description: missing/invalid bearer token }
        "422": { description: "VALIDATION_ERROR (payload.order_id missing for a recognized event type)" }
  /internal/outbox:
    get:
      operationId: internalOutboxPull
      security: [{ internalJwt: [] }]
      description: Read-only pull catch-up for a consumer that may have missed the push relay.
      parameters:
        - { name: after, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: outbox page, content: { application/json: { schema: { $ref: "#/components/schemas/OutboxPullResponse" } } } }
        "401": { description: missing/invalid bearer token }
  /internal/outbox/flush:
    post:
      operationId: internalOutboxFlush
      security: [{ tickSecret: [] }]
      responses:
        "200": { description: flushed, content: { application/json: { schema: { $ref: "#/components/schemas/OutboxFlushResponse" } } } }
        "401": { description: invalid/missing X-Tick-Secret }
  /internal/tick:
    post:
      operationId: internalTick
      security: [{ tickSecret: [] }]
      description: >
        Reconciles in-flight refund attempts, flushes the outbox relay, then runs the
        time-based window sweeps: T12 (offer/link expired -> HUMAN_REVIEW), T21/T22
        (RESOLVED_REFUNDED/RESOLVED_RESHIP -> CLOSED after the resolution grace period), T23
        (DECLINED -> CLOSED after the appeal window). Each phase commits its own transaction.
      responses:
        "200": { description: reconcile + outbox flush + window checks, content: { application/json: { schema: { $ref: "#/components/schemas/InternalTickResponse" } } } }
        "401": { description: invalid/missing X-Tick-Secret }
components:
  securitySchemes:
    internalJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tickSecret:
      type: apiKey
      in: header
      name: X-Tick-Secret
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status: { type: string }
        service: { type: string }
    ReadyResponse:
      type: object
      required: [status, db]
      properties:
        status: { type: string }
        db: { type: string }
    Reason:
      type: object
      properties:
        code: { type: string }
        text: { type: string, nullable: true }
    ReportCaseRequest:
      type: object
      required: [order_id, text]
      properties:
        order_id: { type: string }
        text: { type: string, maxLength: 4000 }
    OfferView:
      type: object
      properties:
        offer_id: { type: string }
        action: { type: string, enum: [REFUND, RESHIP] }
        amount_minor: { type: integer }
        currency: { type: string }
        tier: { type: string, enum: [AUTO, CONFIRM, APPROVE, REVIEW] }
        status: { type: string }
        proposal_hash: { type: string }
        expires_at: { type: string, format: date-time }
    ReportCaseResponse:
      type: object
      properties:
        case_id: { type: string }
        state: { $ref: "#/components/schemas/CaseState" }
        kind: { $ref: "#/components/schemas/Kind" }
        origin: { type: string, enum: [BUYER_REPORT] }
        reasons:
          type: array
          items: { $ref: "#/components/schemas/Reason" }
        offer:
          oneOf:
            - { $ref: "#/components/schemas/OfferView" }
            - type: "null"
        protection: { type: object }
    Kind:
      type: string
      enum: [LATE, LOST, DAMAGED, WRONG_ITEM, NOT_AS_DESCRIBED, OTHER]
    CaseState:
      type: string
      enum:
        [PROTECTED, MONITORING, PROBLEM_DETECTED, TRIAGED, OFFERED, HUMAN_REVIEW, APPROVED,
         REFUNDING, RESOLVED_REFUNDED, RESOLVED_RESHIP, DECLINED, CLOSED]
    CaseDetailResponse:
      type: object
      properties:
        case_id: { type: string }
        order_id: { type: string }
        state: { $ref: "#/components/schemas/CaseState" }
        version: { type: integer }
        kind: { $ref: "#/components/schemas/Kind" }
        origin: { type: string, enum: [DETECTOR, BUYER_REPORT] }
        opened_at: { type: string, format: date-time }
        window_hold: { type: boolean }
        timeline: { type: array, items: { type: object } }
        decision: { type: object, nullable: true }
        offer:
          oneOf:
            - { $ref: "#/components/schemas/OfferView" }
            - type: "null"
        refund: { type: object, nullable: true }
        queued_reason: { type: string, nullable: true }
    ReviewQueueItem:
      type: object
      properties:
        case_id: { type: string }
        kind: { $ref: "#/components/schemas/Kind" }
        reason_codes: { type: array, items: { type: string } }
        entered_at: { type: string, format: date-time }
        age_s: { type: integer }
        sla_target_s: { type: integer, nullable: true }
        sla_state: { type: string, enum: [NO_TARGET, WITHIN, OVER] }
        brief: { type: string }
    ReviewQueueResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ReviewQueueItem" }
    ReviewDecisionRequest:
      type: object
      required: [decision, reviewer_name]
      properties:
        decision: { type: string, enum: [PROPOSE_REFUND, PROPOSE_RESHIP, DECLINE, CLOSE] }
        reviewer_name: { type: string }
        reason: { type: string, nullable: true }
    ReviewDecisionResponse:
      type: object
      properties:
        case_id: { type: string }
        state: { $ref: "#/components/schemas/CaseState" }
        offer_id: { type: string, nullable: true }
    OfferAcceptRequest:
      type: object
      required: [proposal_hash]
      properties:
        proposal_hash: { type: string }
    RefundView:
      type: object
      properties:
        status: { type: string, enum: [NONE, REQUESTED, SENT, COMPLETED, FAILED, UNKNOWN, NOT_SENT] }
        paypal_refund_id: { type: string, nullable: true }
    OfferAcceptResponse:
      type: object
      properties:
        case_id: { type: string }
        state: { $ref: "#/components/schemas/CaseState" }
        execution: { type: string, enum: [DONE, IN_PROGRESS, QUEUED_FROZEN, NOT_STARTED] }
        refund: { $ref: "#/components/schemas/RefundView" }
    OfferDeclineRequest:
      type: object
      required: [reason_code]
      properties:
        reason_code: { type: string, enum: [NOT_WANTED, WANT_HUMAN, OTHER] }
    OfferDeclineResponse:
      type: object
      properties:
        state: { type: string, enum: [DECLINED] }
    ApprovalPreviewResponse:
      type: object
      properties:
        case_id: { type: string }
        action: { type: string, enum: [REFUND, RESHIP] }
        amount_minor: { type: integer }
        currency: { type: string }
        summary: { type: string }
        expires_at: { type: string, format: date-time }
        proposal_hash: { type: string }
    ApprovalConsentRequest:
      type: object
      required: [proposal_hash, csrf_nonce]
      properties:
        proposal_hash: { type: string }
        csrf_nonce: { type: string }
    ApprovalConsentResponse:
      type: object
      properties:
        case_id: { type: string }
        state: { $ref: "#/components/schemas/CaseState" }
        execution: { type: string, enum: [DONE, IN_PROGRESS, QUEUED_FROZEN] }
    MerchantActionRequest:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [OVERRIDE_OFFER, CONFIRM_RESHIP] }
    MerchantActionResponse:
      type: object
      properties:
        case_id: { type: string }
        state: { $ref: "#/components/schemas/CaseState" }
        offer_id: { type: string, nullable: true }
        supersedes: { type: string, nullable: true }
    AppealRequest:
      type: object
      properties:
        note: { type: string, nullable: true }
    AppealResponse:
      type: object
      properties:
        state: { type: string, enum: [HUMAN_REVIEW] }
    ReconcileRequest:
      type: object
      properties:
        limit: { type: integer, default: 25 }
    ReconcileResponse:
      type: object
      properties:
        examined: { type: integer }
        finalized_completed: { type: integer }
        finalized_failed: { type: integer }
        still_unknown: { type: integer }
        needs_review: { type: integer }
        frozen_skipped_replays: { type: integer }
    RefundsFrozenState:
      type: object
      properties:
        refunds_frozen: { type: boolean }
        reason: { type: string, nullable: true }
        set_by: { type: string, nullable: true }
        set_at: { type: string, format: date-time, nullable: true }
        epoch: { type: integer }
        adapter_mirror: { type: string, enum: [ACKED, PENDING] }
        readable: { type: boolean }
    RefundsFrozenPutRequest:
      type: object
      required: [refunds_frozen, reason]
      properties:
        refunds_frozen: { type: boolean }
        reason: { type: string, minLength: 1 }
    NotificationView:
      type: object
      properties:
        id: { type: string }
        case_id: { type: string }
        type: { type: string }
        created_at: { type: string, format: date-time }
        body: { type: string }
    NotificationsResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NotificationView" }
    CaseListItem:
      type: object
      properties:
        case_id: { type: string }
        order_id: { type: string }
        state: { $ref: "#/components/schemas/CaseState" }
        kind: { $ref: "#/components/schemas/Kind" }
        origin: { type: string, enum: [DETECTOR, BUYER_REPORT] }
        opened_at: { type: string, format: date-time }
    ListCasesResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CaseListItem" }
    InternalEventsReceiveResponse:
      type: object
      required: [ok, handled]
      properties:
        ok: { type: boolean }
        handled: { type: boolean }
        case_id: { type: string, nullable: true }
    OutboxEventView:
      type: object
      properties:
        seq: { type: integer }
        event_id: { type: string, format: uuid }
        type: { type: string }
        version: { type: integer }
        aggregate_id: { type: string }
        payload: { type: object }
        trace_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    OutboxPullResponse:
      type: object
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/OutboxEventView" }
    OutboxFlushResponse:
      type: object
      properties:
        delivered: { type: integer }
        failed: { type: integer }
        pending: { type: integer }
    InternalTickResponse:
      type: object
      properties:
        reconcile: { $ref: "#/components/schemas/ReconcileResponse" }
        outbox_relay: { $ref: "#/components/schemas/OutboxFlushResponse" }
        offers_expired_to_review: { type: integer }
        resolved_closed: { type: integer }
        declined_closed: { type: integer }
    InternalEventEnvelope:
      type: object
      required: [event_id, type, version, aggregate_id, payload]
      properties:
        event_id: { type: string, format: uuid }
        type: { type: string }
        version: { type: integer }
        aggregate_id: { type: string }
        payload: { type: object }
        trace_id: { type: string, nullable: true }
    ErrorEnvelope:
      type: object
      required: [error, detail]
      properties:
        error: { type: string }
        detail: { type: string }
        request_id: { type: string, nullable: true }
