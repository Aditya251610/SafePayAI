openapi: 3.1.0
info:
  title: tracking
  version: "0.1.0"
  description: >
    Carrier/delivery state machine, owned entirely in our DB (PayPal has no delivery-status
    API; carrier/delivery status is SIMULATED, driven by this service's own demo clock, not
    real PayPal data). Derived from .claude/prd/services/tracking/api.md and the real app/
    source (app/routers/*.py, app/usecases/*.py, app/schemas/shipments.py). All routes below
    are real except POST /internal/events and GET /internal/events, which remain 501 stubs
    (not yet implemented). The late/lost detector (POST /detector/run, POST /internal/tick)
    and the demo-clock endpoints are live-tested against the real demo clock; the PayPal
    tracker-mirror calls made from POST /shipments and POST /shipments/{id}/cancel are also
    live-tested against the PayPal sandbox, though the tracker-mirror call has been observed
    to be rejected (422) by PayPal itself when attempted against an already-fully-refunded
    sandbox order -- a sandbox state limitation, not a code bug; paypal_sync reports FAILED
    in that case rather than blocking the local state change.
servers:
  - url: /
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: liveness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
  /healthz:
    get:
      operationId: healthz
      responses:
        "200":
          description: liveness (alias)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
  /readyz:
    get:
      operationId: readyz
      responses:
        "200":
          description: ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadyResponse" }
        "503":
          description: not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadyResponse" }
  /healthz/deep:
    get:
      operationId: healthzDeep
      responses:
        "200":
          description: keep-warm deep check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadyResponse" }
  /shipments:
    post:
      operationId: createShipment
      security: [{ internalJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShipmentCreateRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShipmentCreateResponse" }
        "200": { description: idempotent replay (same order_id + tracking_number already exists) }
        "401": { description: unauthenticated }
        "409": { description: ORDER_NOT_CAPTURED (order not yet captured per checkout) }
        "503": { description: CHECKOUT_UNREACHABLE }
  /shipments/{order_id}:
    get:
      operationId: getShipments
      security: [{ internalJwt: [] }]
      parameters:
        - { name: order_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: >
            Shipment(s) + consistency block. Always 200 even for an order with zero
            shipments (empty shipments array) -- there is no 404/403 branch in the real
            handler.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShipmentsListResponse" }
        "401": { description: unauthenticated }
  /shipments/{order_id}/verify:
    get:
      operationId: verifyClaim
      security: [{ internalJwt: [] }]
      parameters:
        - { name: order_id, in: path, required: true, schema: { type: string } }
        - { name: claim, in: query, required: true, schema: { type: string, enum: [LATE, LOST, NOT_DELIVERED] } }
      responses:
        "200":
          description: consistency result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyClaimResponse" }
        "400": { description: INVALID_CLAIM (claim query param not one of LATE/LOST/NOT_DELIVERED) }
        "401": { description: unauthenticated }
  /shipments/{shipment_id}/cancel:
    post:
      operationId: cancelShipment
      security: [{ internalJwt: [] }]
      parameters:
        - { name: shipment_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelShipmentRequest" }
      responses:
        "200":
          description: cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancelShipmentResponse" }
        "401": { description: unauthenticated }
        "404": { description: SHIPMENT_NOT_FOUND }
        "409": { description: ILLEGAL_TRANSITION (shipment already DELIVERED or CANCELLED) }
  /demo/clock:
    get:
      operationId: getDemoClock
      summary: Current sim time. No sandbox/role guard on this read-only endpoint.
      security: [{ internalJwt: [] }]
      responses:
        "200":
          description: current sim time
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoClockResponse" }
        "401": { description: unauthenticated }
  /demo/clock/advance:
    post:
      operationId: advanceDemoClock
      summary: >
        Guard order (spec s8): PS_TRACKING_SANDBOX_MODE -> DEMO_CONTROLS_ENABLED -> JWT
        merchant role -> Idempotency-Key header -> bounds. Replaying an already-used
        Idempotency-Key re-runs a tick and returns the originally recorded from_sim/to_sim
        rather than erroring.
      security: [{ internalJwt: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DemoClockAdvanceRequest" }
      responses:
        "200":
          description: advanced (or idempotent replay of a previously-used Idempotency-Key)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoClockAdvanceResponse" }
        "400":
          description: >
            delta_seconds out of bounds, or CLOCK_VERSION_CONFLICT (concurrent advance lost
            the CAS race) -- both surface as 400, not 409, in the real handler.
        "403": { description: ROLE_NOT_ALLOWED (JWT role claim is not merchant) }
        "404": { description: sandbox mode off, or demo controls disabled }
  /demo/clock/reset:
    post:
      operationId: resetDemoClock
      summary: Same guard order as /demo/clock/advance (sandbox mode, demo controls, merchant role).
      security: [{ internalJwt: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DemoClockResetRequest" }
      responses:
        "200":
          description: reset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoClockResetResponse" }
        "403": { description: ROLE_NOT_ALLOWED }
        "404": { description: sandbox mode off, or demo controls disabled }
  /demo/shipments/{shipment_id}/force:
    post:
      operationId: forceShipment
      summary: Same guard order as /demo/clock/advance (sandbox mode, demo controls, merchant role).
      security: [{ internalJwt: [] }]
      parameters:
        - { name: shipment_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DemoForceShipmentRequest" }
      responses:
        "200":
          description: forced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoForceShipmentResponse" }
        "403": { description: ROLE_NOT_ALLOWED }
        "404": { description: SHIPMENT_NOT_FOUND, or sandbox mode off / demo controls disabled }
        "409": { description: ILLEGAL_TRANSITION }
  /detector/run:
    post:
      operationId: detectorRun
      summary: Manual trigger; calls the same run_tick used by POST /internal/tick (spec.md section 5, conflict C1).
      security: [{ internalJwt: [] }]
      responses:
        "200":
          description: tick result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetectorRunResponse" }
        "401": { description: unauthenticated }
  /internal/tick:
    post:
      operationId: internalTick
      summary: >
        External cron trigger (shared bare INTERNAL_TICK_SECRET convention). Calls the same
        run_tick as POST /detector/run with trigger=EXTERNAL. Never routed by the gateway.
      security: [{ tickSecret: [] }]
      responses:
        "200":
          description: tick result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetectorRunResponse" }
        "401": { description: invalid or missing tick secret }
  /internal/events:
    post:
      operationId: receiveInternalEvent
      summary: Not yet implemented -- still a 501 stub.
      security: [{ internalJwt: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InternalEventEnvelope" }
      responses:
        "501": { description: "\"POST /internal/events pending Wave 5\" -- genuinely not implemented" }
    get:
      operationId: pullInternalEvents
      summary: Not yet implemented -- still a 501 stub.
      security: [{ internalJwt: [] }]
      parameters:
        - { name: after, in: query, schema: { type: integer } }
      responses:
        "501": { description: "\"GET /internal/events pending Wave 5\" -- genuinely not implemented" }
components:
  securitySchemes:
    internalJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tickSecret:
      type: apiKey
      in: header
      name: X-Tick-Secret
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status: { type: string }
        service: { type: string }
    ReadyResponse:
      type: object
      required: [status, db]
      properties:
        status: { type: string }
        db: { type: string }
    ShipmentCreateRequest:
      type: object
      required: [order_id, tracking_number, carrier_name]
      properties:
        order_id: { type: string }
        tracking_number: { type: string }
        carrier_name: { type: string }
        outcome_profile: { type: string, enum: [ON_TIME, LATE, LOST, DELIVERED_AFTER_LATE] }
    ShipmentCreateResponse:
      type: object
      properties:
        id: { type: string }
        order_id: { type: string }
        status: { type: string }
        promised_at_sim: { type: string, format: date-time }
        paypal_sync: { type: string, enum: [ADDED, FAILED, NOT_ATTEMPTED] }
        paypal_tracker_id: { type: string }
        simulated: { type: boolean }
        carrier_label: { type: string }
    ShipmentEvent:
      type: object
      properties:
        seq: { type: integer }
        to: { type: string }
        source: { type: string, enum: [SCRIPT, FORCE, MERCHANT] }
        occurred_at_sim: { type: string, format: date-time }
    ShipmentView:
      type: object
      description: >
        The real GET /shipments/{order_id} handler (app/routers/shipments.py get_shipments)
        currently returns only id/status/active/promised_at_sim/anomaly per shipment -- it
        does not populate `events` even though ShipmentEvent exists as a schema shape; listed
        here as not currently present on this response, not a guaranteed field.
      properties:
        id: { type: string }
        status: { type: string }
        active: { type: boolean }
        promised_at_sim: { type: string, format: date-time }
        anomaly: { type: string, nullable: true }
        events:
          type: array
          items: { $ref: "#/components/schemas/ShipmentEvent" }
    ConsistencyBlock:
      type: object
      properties:
        delivered: { type: boolean }
        delivered_at_sim: { type: string, format: date-time, nullable: true }
        late_detected: { type: boolean }
        lost_detected: { type: boolean }
    ShipmentsListResponse:
      type: object
      properties:
        order_id: { type: string }
        sim_now: { type: string, format: date-time }
        shipments:
          type: array
          items: { $ref: "#/components/schemas/ShipmentView" }
        consistency: { $ref: "#/components/schemas/ConsistencyBlock" }
        simulated: { type: boolean }
        carrier_label:
          type: string
          description: Always "SIMULATED CARRIER" (CLAUDE.md honesty rule) -- present on the real response, previously missing from this schema.
    VerifyClaimResponse:
      type: object
      properties:
        result: { type: string, enum: [CONSISTENT, CONTRADICTED, INSUFFICIENT] }
        reason_code: { type: string }
        sim_now: { type: string, format: date-time }
    CancelShipmentRequest:
      type: object
      properties:
        reason_code: { type: string }
    CancelShipmentResponse:
      type: object
      properties:
        status: { type: string, enum: [CANCELLED] }
        paypal_sync: { type: string, enum: [CANCELLED, FAILED] }
    DemoClockResponse:
      type: object
      properties:
        sim_now: { type: string, format: date-time }
    DemoClockAdvanceRequest:
      type: object
      required: [delta_seconds, reason]
      properties:
        delta_seconds: { type: integer }
        reason: { type: string }
    TickSummary:
      type: object
      properties:
        applied: { type: integer }
        detected: { type: integer }
        skipped_lease: { type: boolean }
    DemoClockAdvanceResponse:
      type: object
      properties:
        from_sim: { type: string, format: date-time }
        to_sim: { type: string, format: date-time }
        version: { type: integer }
        tick: { $ref: "#/components/schemas/TickSummary" }
    DemoClockResetRequest:
      type: object
      properties:
        reason: { type: string }
    DemoClockResetResponse:
      type: object
      properties:
        offset_seconds: { type: integer }
    DemoForceShipmentRequest:
      type: object
      required: [to_status, reason]
      properties:
        to_status: { type: string }
        reason: { type: string }
    DemoForceShipmentResponse:
      type: object
      properties:
        id: { type: string }
        status: { type: string }
        source: { type: string, enum: [FORCE] }
        tick: { $ref: "#/components/schemas/TickSummary" }
    DetectorRunResponse:
      type: object
      properties:
        trigger: { type: string, enum: [manual, inprocess, ping, external] }
        skipped_lease: { type: boolean }
        applied: { type: integer }
        detected: { type: integer }
        sim_now: { type: string, format: date-time }
    InternalEventEnvelope:
      type: object
      required: [event_id, type, version, aggregate_id, payload]
      properties:
        event_id: { type: string, format: uuid }
        type: { type: string }
        version: { type: integer }
        aggregate_id: { type: string }
        payload: { type: object }
        trace_id: { type: string, nullable: true }
    ErrorEnvelope:
      type: object
      required: [error, detail]
      properties:
        error: { type: string }
        detail: { type: string }
        request_id: { type: string, nullable: true }
