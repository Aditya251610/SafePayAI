openapi: 3.1.0
info:
  title: catalog
  version: "0.1.0"
  description: >
    Seeded, read-only product catalog (SIMULATED data, sandbox only).
    Derived from .claude/prd/services/catalog/api.md. Wave 4: contracts +
    skeleton only; routes other than health/readyz return 501 until Wave 5.
servers:
  - url: /api/catalog
    description: behind api-gateway
components:
  securitySchemes:
    internalBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        detail:
          type: string
        request_id:
          type: string
          nullable: true
      required: [error, detail]
    Item:
      type: object
      properties:
        sku: { type: string }
        merchant_id: { type: string }
        category_id: { type: string }
        title: { type: string }
        description: { type: string }
        unit_price_minor: { type: integer }
        currency: { type: string }
        active: { type: boolean }
        text_trust: { type: string }
        label: { type: string }
      required: [sku, merchant_id, category_id, title, description, unit_price_minor, currency, active]
    ItemsResponse:
      type: object
      properties:
        catalog_version: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/Item" }
    Merchant:
      type: object
      properties:
        merchant_id: { type: string }
        display_name: { type: string }
        settlement_alias: { type: string }
        currency: { type: string }
    MerchantsResponse:
      type: object
      properties:
        merchants:
          type: array
          items: { $ref: "#/components/schemas/Merchant" }
    Category:
      type: object
      properties:
        category_id: { type: string }
        display_name: { type: string }
    CategoriesResponse:
      type: object
      properties:
        categories:
          type: array
          items: { $ref: "#/components/schemas/Category" }
    CatalogVersionResponse:
      type: object
      properties:
        catalog_version: { type: integer }
        seed_hash: { type: string }
        item_count: { type: integer }
        merchant_count: { type: integer }
    PriceResolveLine:
      type: object
      properties:
        sku: { type: string }
        qty: { type: integer, minimum: 1 }
        agent_stated_price_minor: { type: integer, nullable: true }
      required: [sku, qty]
      additionalProperties: false
    PriceResolveRequest:
      type: object
      properties:
        lines:
          type: array
          items: { $ref: "#/components/schemas/PriceResolveLine" }
        currency: { type: string, nullable: true }
        catalog_version: { type: integer, nullable: true }
      required: [lines]
      additionalProperties: false
    PricedLine:
      type: object
      properties:
        sku: { type: string }
        merchant_id: { type: string }
        category_id: { type: string }
        qty: { type: integer }
        unit_price_minor: { type: integer }
        line_total_minor: { type: integer }
        settlement_alias: { type: string }
        price_mismatch: { type: boolean }
        latest_unit_price_minor: { type: integer, nullable: true }
    PriceResolveResponse:
      type: object
      properties:
        catalog_version: { type: integer }
        currency: { type: string }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PricedLine" }
        merchant_ids:
          type: array
          items: { type: string }
        total_minor: { type: integer }
        price_mismatch_any: { type: boolean }
    RefundPolicySeedResponse:
      type: object
      properties:
        merchant_id: { type: string }
        refund_cap_minor: { type: integer }
        currency: { type: string }
        excluded_category_ids:
          type: array
          items: { type: string }
        velocity_max_refunds: { type: integer }
        velocity_window_days: { type: integer }
        authoritative: { type: boolean }
        note: { type: string }
security:
  - internalBearer: []
paths:
  /health:
    get:
      operationId: health
      security: []
      responses:
        "200": { description: OK }
  /healthz:
    get:
      operationId: healthz
      security: []
      responses:
        "200": { description: OK }
  /readyz:
    get:
      operationId: readyz
      security: []
      responses:
        "200": { description: Ready }
        "503": { description: Not ready }
  /items:
    get:
      operationId: listItems
      parameters:
        - name: merchant_id
          in: query
          schema: { type: string }
        - name: category_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemsResponse" }
        "401": { description: Unauthenticated }
        "403": { description: Forbidden }
        "501": { description: Not implemented (Wave 4) }
  /items/{sku}:
    get:
      operationId: getItem
      parameters:
        - name: sku
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "404": { description: Item not found }
        "501": { description: Not implemented (Wave 4) }
  /merchants:
    get:
      operationId: listMerchants
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantsResponse" }
        "501": { description: Not implemented (Wave 4) }
  /merchants/{merchant_id}/refund-policy-seed:
    get:
      operationId: getRefundPolicySeed
      parameters:
        - name: merchant_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefundPolicySeedResponse" }
        "404": { description: Merchant not found }
        "501": { description: Not implemented (Wave 4) }
  /categories:
    get:
      operationId: listCategories
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoriesResponse" }
        "501": { description: Not implemented (Wave 4) }
  /catalog/version:
    get:
      operationId: getCatalogVersion
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogVersionResponse" }
        "501": { description: Not implemented (Wave 4) }
  /prices/resolve:
    post:
      operationId: resolvePrices
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PriceResolveRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceResolveResponse" }
        "404": { description: Catalog version unknown }
        "422": { description: Validation error }
        "501": { description: Not implemented (Wave 4) }
  /admin/seed:
    post:
      operationId: adminSeed
      responses:
        "200": { description: OK }
        "403": { description: Admin disabled / forbidden }
        "501": { description: Not implemented (Wave 4) }
  /admin/reset:
    post:
      operationId: adminReset
      responses:
        "200": { description: OK }
        "403": { description: Admin disabled / forbidden }
        "501": { description: Not implemented (Wave 4) }
  /admin/fixtures:
    get:
      operationId: adminFixtures
      responses:
        "200": { description: OK }
        "403": { description: Forbidden }
        "501": { description: Not implemented (Wave 4) }
