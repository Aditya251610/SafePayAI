name: deps

on:
  pull_request:
    paths:
      - "**/pyproject.toml"
      - "**/uv.lock"
      - "services/web/package.json"
      - "services/web/pnpm-lock.yaml"
  schedule:
    - cron: "0 7 * * 1"  # weekly, Monday 07:00 UTC
  # No push-to-main trigger (same reasoning as secrets.yml: a merge just re-runs what the PR
  # already ran). Path-filtered on PR so a docs-only or app-logic-only change doesn't spin up
  # 11 audit jobs for nothing; the weekly cron still covers drift between dependency changes.

permissions:
  contents: read

jobs:
  python-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        slug:
          [api-gateway, mandate, catalog, shopping-agent, checkout, paypal-adapter, tracking, resolution, triage-ai, audit]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: |
          cd services/${{ matrix.slug }}
          uv export --no-hashes > /tmp/reqs.txt || true
          [ -s /tmp/reqs.txt ] && uvx pip-audit -r /tmp/reqs.txt || echo "no lockfile yet, skipping"

  web-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - run: pnpm install --frozen-lockfile || echo "no lockfile yet, skipping"
      - run: pnpm audit --prod || true
