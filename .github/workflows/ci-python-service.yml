name: ci-python-service

on:
  workflow_call:
    inputs:
      slug:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-python-${{ inputs.slug }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: cd services/${{ inputs.slug }} && uv sync --all-extras --dev
      - run: cd services/${{ inputs.slug }} && uv run ruff check .
      - run: cd services/${{ inputs.slug }} && uv run ruff format --check .

  type:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: cd services/${{ inputs.slug }} && uv sync --all-extras --dev
      - run: cd services/${{ inputs.slug }} && uv run mypy app

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: cd services/${{ inputs.slug }} && uv sync --all-extras --dev
      - run: cd services/${{ inputs.slug }} && uv run pytest tests/unit -q

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: cd services/${{ inputs.slug }} && uv sync --all-extras --dev
      - name: run migrations from scratch
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: cd services/${{ inputs.slug }} && uv run alembic upgrade head
      - run: cd services/${{ inputs.slug }} && uv run pytest tests/integration -q
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ inputs.slug }}
          push: false
          tags: ps-${{ inputs.slug }}:ci
