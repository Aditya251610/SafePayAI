name: ci-python-service

on:
  workflow_call:
    inputs:
      slug:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-python-${{ inputs.slug }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: cd services/${{ inputs.slug }} && uv sync --all-extras --dev
      - run: cd services/${{ inputs.slug }} && uv run ruff check .
      - run: cd services/${{ inputs.slug }} && uv run ruff format --check .

  type:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: cd services/${{ inputs.slug }} && uv sync --all-extras --dev
      - run: cd services/${{ inputs.slug }} && uv run mypy app

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: cd services/${{ inputs.slug }} && uv sync --all-extras --dev
      - run: cd services/${{ inputs.slug }} && uv run pytest tests/unit -q

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: cd services/${{ inputs.slug }} && uv sync --all-extras --dev
      - name: export per-service DATABASE_URL env vars
        # Each service reads its own PS_<SLUG>_{DATABASE_URL,MIGRATION_DATABASE_URL} (audit uses
        # _MIGRATE_DATABASE_URL instead of _MIGRATION_DATABASE_URL) per
        # docs/service-skeleton-conventions.md section 2 — a bare DATABASE_URL is never read by
        # any service's settings.py, so export every plausible name pointing at the same local
        # test Postgres rather than hardcoding one convention per service here.
        run: |
          SLUG_UPPER=$(echo "${{ inputs.slug }}" | tr '[:lower:]' '[:upper:]' | tr -d '-')
          URL="postgresql+asyncpg://postgres:postgres@localhost:5432/postgres"
          {
            echo "PS_${SLUG_UPPER}_DATABASE_URL=${URL}"
            echo "PS_${SLUG_UPPER}_MIGRATION_DATABASE_URL=${URL}"
            echo "PS_${SLUG_UPPER}_MIGRATE_DATABASE_URL=${URL}"
            echo "PS_${SLUG_UPPER}_SEED_DATABASE_URL=${URL}"
            echo "DATABASE_URL=${URL}"
          } >> "$GITHUB_ENV"
      - name: run migrations from scratch
        run: cd services/${{ inputs.slug }} && uv run alembic upgrade head
      - run: cd services/${{ inputs.slug }} && uv run pytest tests/integration -q

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ inputs.slug }}/Dockerfile
          push: false
          tags: ps-${{ inputs.slug }}:ci
