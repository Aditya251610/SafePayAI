name: secrets

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC
  # Deliberately no push-to-main trigger: every merge to main is a squash-merge of a PR that
  # already ran this exact check, so re-running against the identical merge commit is pure
  # duplication. The weekly cron still catches anything that slips in another way.

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Run the gitleaks binary directly instead of gitleaks/gitleaks-action@v2: that action
      # now gates most usage behind a paid GITLEAKS_LICENSE secret (an upstream breaking
      # change), which is unrelated to whether our repo actually leaks anything.
      - name: install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: run gitleaks (full history)
        run: gitleaks detect --source . --redact -v --config .gitleaks.toml --log-opts="--all"
