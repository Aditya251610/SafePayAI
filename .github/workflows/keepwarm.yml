name: keepwarm

on:
  schedule:
    - cron: "*/10 8-22 * * *"  # every 10 min, 08:00-22:00 UTC, see deployment-zero-cost.md budget math
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/warmup.sh
