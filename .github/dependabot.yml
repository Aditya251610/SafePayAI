  - package-ecosystem: "docker"
    directory: "/services/checkout"
    schedule: { interval: "monthly" }
    groups:
      checkout_docker: { patterns: ["*"] }
  - package-ecosystem: "docker"
    directory: "/services/paypal-adapter"
    schedule: { interval: "monthly" }
    groups:
      paypal_adapter_docker: { patterns: ["*"] }
  - package-ecosystem: "docker"
    directory: "/services/tracking"
    schedule: { interval: "monthly" }
    groups:
      tracking_docker: { patterns: ["*"] }
  - package-ecosystem: "docker"
    directory: "/services/resolution"
    schedule: { interval: "monthly" }
