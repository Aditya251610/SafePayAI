# Version-update PRs are paused (open-pull-requests-limit: 0) until after hackathon submission to stop
# per-merge PR/email churn. Security updates are unaffected. Raise the limit (default 5) to resume.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 0
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: "npm"
    directory: "/services/web"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 0
    ignore:
      # Majors (Next, Tailwind, Zod, TypeScript, ESLint, Vitest, ...) are taken deliberately, not in a batch.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      web-deps: { patterns: ["*"] }

  - package-ecosystem: "pip"
    directory: "/services/api-gateway"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 0
    groups:
      api_gateway_deps: { patterns: ["*"] }
  - package-ecosystem: "pip"
    directory: "/services/mandate"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 0
    groups:
      mandate_deps: { patterns: ["*"] }
  - package-ecosystem: "pip"
    directory: "/services/catalog"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 0
    groups:
      catalog_deps: { patterns: ["*"] }
  - package-ecosystem: "pip"
    directory: "/services/shopping-agent"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 0
    ignore:
      # LLM SDK majors are only taken with live-key verification (AI services fail closed).
      - dependency-name: "google-genai"
        update-types: ["version-update:semver-major"]
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]
    groups:
      shopping_agent_deps: { patterns: ["*"] }
  - package-ecosystem: "pip"
    directory: "/services/checkout"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 0
    groups:
      checkout_deps: { patterns: ["*"] }
