version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "monthly" }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: "npm"
    directory: "/services/web"
    schedule: { interval: "monthly" }
    groups:
      web-deps: { patterns: ["*"] }

  - package-ecosystem: "pip"
    directory: "/services/api-gateway"
    schedule: { interval: "monthly" }
    groups:
      api_gateway_deps: { patterns: ["*"] }
  - package-ecosystem: "pip"
    directory: "/services/mandate"
    schedule: { interval: "monthly" }
    groups:
      mandate_deps: { patterns: ["*"] }
  - package-ecosystem: "pip"
    directory: "/services/catalog"
    schedule: { interval: "monthly" }
    groups:
      catalog_deps: { patterns: ["*"] }
  - package-ecosystem: "pip"
    directory: "/services/shopping-agent"
    schedule: { interval: "monthly" }
    groups:
      shopping_agent_deps: { patterns: ["*"] }
  - package-ecosystem: "pip"
    directory: "/services/checkout"
    schedule: { interval: "monthly" }
    groups:
      checkout_deps: { patterns: ["*"] }
  - package-ecosystem: "pip"
    directory: "/services/paypal-adapter"
    schedule: { interval: "monthly" }
    groups:
      paypal_adapter_deps: { patterns: ["*"] }
  - package-ecosystem: "pip"
    directory: "/services/tracking"
    schedule: { interval: "monthly" }
    groups:
      tracking_deps: { patterns: ["*"] }
  - package-ecosystem: "pip"
    directory: "/services/resolution"
