      tracking_deps: { patterns: ["*"] }
  - package-ecosystem: "pip"
    directory: "/services/resolution"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 0
    groups:
      resolution_deps: { patterns: ["*"] }
  - package-ecosystem: "pip"
    directory: "/services/triage-ai"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 0
    ignore:
      # LLM SDK majors are only taken with live-key verification (AI services fail closed).
      - dependency-name: "google-genai"
        update-types: ["version-update:semver-major"]
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]
    groups:
      triage_ai_deps: { patterns: ["*"] }
  - package-ecosystem: "pip"
    directory: "/services/audit"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 0
    groups:
      audit_deps: { patterns: ["*"] }

  - package-ecosystem: "docker"
    directory: "/services/api-gateway"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 0
    ignore:
      # Runtime stays on the Python 3.12 line the lockfile, CI and the live deploy use.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      api_gateway_docker: { patterns: ["*"] }
