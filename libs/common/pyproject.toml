[project]
name = "safepayai-common"
version = "0.1.0"
requires-python = ">=3.12"
description = "Shared cross-cutting infra (no business logic): JWT verify/mint, db grants helper, HTTP client defaults, LLM gateway interface."
dependencies = [
  "pyjwt>=2.9",
  "httpx>=0.27",
  "sqlalchemy[asyncio]>=2.0",
  "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["safepayai_common"]
